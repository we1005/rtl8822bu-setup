name: Tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile rtl8822bu_setup.py
      - run: sh -n install.sh check.sh uninstall.sh
  route-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo python3 tests/integration_netns.py
